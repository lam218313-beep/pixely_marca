<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pixely - Planes</title>
<link rel="stylesheet" href="../comun/base.css">
<style>
/* Una ficha por plan, mismo formato. Cada plan tiene su tono: Lite claro, Basic grafito, Pro noche.
   Tamaños: solo la escala de comun/base.css (--fs-*). */
.plan-pg { padding: 0; background: var(--paper); }
.lbl { font: 800 var(--fs-label)/1.2 Manrope; letter-spacing: .14em; text-transform: uppercase; }

/* Tonos */
.lite  { --h-bg: #F2F2F5; --h-t1: #0A0A0C; --h-t2: #55555F; --h-t3: #8A8A96; --h-line: rgba(10,10,12,.1); --h-chip: #fff; --tile: #0A0A0C; --tile-off: rgba(10,10,12,.08); }
.basic { --h-bg: linear-gradient(160deg, #2C2C36 0%, #1B1B22 100%); --h-t1: #fff; --h-t2: #C4C4CC; --h-t3: #8A8A96; --h-line: rgba(255,255,255,.12); --h-chip: rgba(255,255,255,.08); --tile: #fff; --tile-off: rgba(255,255,255,.1); }
.pro   { --h-bg: #0A0A0C; --h-t1: #fff; --h-t2: #B4B4BE; --h-t3: #8A8A96; --h-line: rgba(255,255,255,.1); --h-chip: rgba(255,255,255,.06); --tile: #fff; --tile-off: rgba(255,255,255,.1); }

/* ===== Cabecera ===== */
.hero { flex: none; position: relative; overflow: hidden; padding: 34px 56px 26px; background: var(--h-bg); color: var(--h-t1); }
.hero .radar { position: absolute; right: -250px; top: -240px; width: 640px; height: 640px; }
.pro .hero::after { content: ''; position: absolute; left: -120px; bottom: -220px; width: 520px; height: 420px; background: radial-gradient(closest-side, rgba(235,12,110,.28), transparent); pointer-events: none; }
.top { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; }
.tiers { display: inline-flex; gap: 3px; padding: 3px; border-radius: 99px; background: var(--h-chip); box-shadow: inset 0 0 0 1px var(--h-line); }
.tiers span { height: 26px; padding: 0 14px; border-radius: 99px; display: inline-flex; align-items: center; font: 700 var(--fs-label) Manrope; letter-spacing: .06em; color: var(--h-t3); }
.tiers span.on { background: var(--pink); color: #fff; }
.grid { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 200px; gap: 24px; margin-top: 22px; }
.badge { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 12px; border-radius: 99px; color: var(--h-t2); box-shadow: inset 0 0 0 1px var(--h-line); }
.pro .badge { background: var(--pink); color: #fff; box-shadow: none; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--pink); }
.pro .badge::before { background: #fff; }
.hero h1 { margin-top: 14px; font: 700 var(--fs-display)/1 Unbounded; letter-spacing: -.05em; white-space: nowrap; }
.hero .lead { margin-top: 12px; max-width: 380px; font: 500 var(--fs-lead)/1.5 Manrope; color: var(--h-t2); }
.price { display: flex; align-items: baseline; gap: 10px; margin-top: 18px; }
.price b { font: 700 var(--fs-title)/1 Unbounded; letter-spacing: -.04em; }
.pro .price b { color: var(--pink); }
.price span { font: 600 var(--fs-body) Manrope; color: var(--h-t3); }
.hero .frame { height: 236px; border-radius: var(--r-lg); padding: 6px; background: var(--h-chip); box-shadow: inset 0 0 0 1px var(--h-line); }
.pro .hero .frame { box-shadow: inset 0 0 0 1.5px var(--pink), 0 24px 60px -20px rgba(235,12,110,.55); }
.hero .frame img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 22px; }

/* Volumen: un cuadro por pieza al mes (rosa = reel) */
.vol { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--h-line); }
.tiles { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; }
.tiles i { aspect-ratio: 1; border-radius: 5px; background: var(--tile-off); }
.tiles i.f { background: var(--tile); }
.tiles i.r { background: var(--pink); }
.pro .tiles i.r { box-shadow: 0 0 10px rgba(235,12,110,.7); }
.vol .lbl { color: var(--h-t3); margin-bottom: 10px; display: block; }
.nums { display: flex; gap: 22px; }
.nums div b { display: block; font: 700 var(--fs-num)/1 Unbounded; letter-spacing: -.05em; }
.nums div b.pk { color: var(--pink); }
.nums div span { display: block; margin-top: 4px; font: 600 var(--fs-label)/1.3 Manrope; color: var(--h-t2); }

/* ===== Cuerpo ===== */
.body { flex: 1; display: flex; flex-direction: column; padding: 18px 56px 0; color: var(--p1); }
.body > .lbl { color: var(--pink); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.col { display: grid; gap: 12px; align-content: start; }
.blk { border-radius: var(--r); padding: 14px 16px 10px; background: #F5F5F7; }
.pro .blk { background: #0A0A0C; color: #fff; }
.basic .blk { background: #EFEFF2; }
.blk h4 { display: flex; justify-content: space-between; align-items: baseline; font: 700 var(--fs-body) Unbounded; letter-spacing: -.02em; }
.blk h4 span { font: 700 var(--fs-label) Manrope; letter-spacing: .1em; text-transform: uppercase; color: var(--p3); }
.blk ul { list-style: none; margin-top: 8px; }
.blk li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; min-height: 27px; padding: 4px 0; border-top: 1px solid var(--pline); font: 600 var(--fs-body)/1.3 Manrope; }
.pro .blk li { border-color: rgba(255,255,255,.08); }
.blk li em { font-style: normal; display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 99px; background: #fff; font: 800 var(--fs-label) Manrope; letter-spacing: .04em; color: var(--p1); white-space: nowrap; }
.basic .blk li em { background: #fff; }
.pro .blk li em { background: rgba(235,12,110,.16); color: #FF7AB0; }
.blk li em.top { background: var(--pink); color: #fff; }
.blk li svg { width: 20px; height: 20px; padding: 4px; border-radius: 50%; background: var(--pink); fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.blk li.no { color: var(--p3); font-weight: 500; }
.pro .blk li.no { color: var(--t3); }
.blk li.no em { background: none; box-shadow: inset 0 0 0 1px rgba(10,10,12,.14); color: var(--p3); font-weight: 700; }

/* Hablemos */
.talk { margin-top: auto; display: grid; grid-template-columns: 1fr 96px; gap: 20px; align-items: center; padding: 16px 16px 16px 24px; border-radius: var(--r-lg); background: var(--ink); color: #fff; }
.talk h3 { font: 700 var(--fs-title)/1 Unbounded; letter-spacing: -.045em; }
.talk p { margin-top: 6px; font: 500 var(--fs-body)/1.5 Manrope; color: var(--t2); }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; margin-top: 12px; padding: 0 18px; border-radius: 14px; background: var(--pink); font: 800 var(--fs-label) Manrope; letter-spacing: .1em; text-transform: uppercase; color: #fff; }
.talk small { margin-left: 14px; font: 600 var(--fs-body) Manrope; color: var(--t3); }
.qr { display: block; padding: 8px; border-radius: 16px; background: #fff; }
.qr img { display: block; width: 100%; }
.legal { margin-top: 10px; }
.foot { margin-top: 0; font-size: var(--fs-label); }
</style>
</head>
<body>

<template id="hoja">
<section class="page plan-pg">
  <div class="hero">
    <div class="top"><span class="wm">pixely<b>.</b></span><span class="tiers"><span>Lite</span><span>Basic</span><span>Pro</span></span></div>
    <div class="grid">
      <div>
        <span class="badge lbl" data-k="eyebrow"></span>
        <h1>Plan <span data-k="nombre"></span><span class="dot">.</span></h1>
        <p class="lead" data-k="lema"></p>
        <div class="price"><b data-k="precio"></b><span>al mes</span></div>
      </div>
      <div class="frame"><img alt=""></div>
    </div>
    <div class="vol">
      <div><span class="lbl">Tu contenido al mes · un cuadro por pieza</span><div class="tiles"></div></div>
      <div class="nums"></div>
    </div>
  </div>
  <div class="body">
    <span class="lbl">Todo lo que incluye</span>
    <div class="cols"></div>
    <div class="talk">
      <div>
        <h3>Hablemos<span class="dot">.</span></h3>
        <p>Te contamos cómo funciona y te recomendamos el plan según tu negocio.</p>
        <a class="btn" data-wa>Me interesa el Plan <span data-k="nombre"></span> →</a><small><a href="https://pixely.pe">pixely.pe</a> · <a href="mailto:hola@pixely.pe">hola@pixely.pe</a></small>
      </div>
      <a class="qr" href="https://wa.me/51949268607?text=%C2%A1Hola%20Pixely%21%20%F0%9F%91%8B%20Quiero%20que%20mi%20negocio%20destaque%20%E2%9C%A8"><img src="../comun/qr-whatsapp.svg" alt=""></a>
    </div>
    <p class="note legal">Tu primer plan de contenido llega en máximo 7 días hábiles después de la entrevista. No hacemos sesiones fotográficas, no respondemos mensajes ni comentarios de tus redes y no diseñamos logotipos fuera de tu plan de contenido. Los resultados pueden variar según el negocio, el sector y la constancia en la publicación. No garantizamos resultados de ventas específicos: garantizamos contenido profesional y estratégico.</p>
    <div class="foot"><span class="wm">pixely<b>.</b></span><a href="https://pixely.pe">pixely.pe</a><span>Syntesia Labs E.I.R.L. · RUC 20616010787</span></div>
  </div>
</section>
</template>

<script>
// Un plan por hoja, en este orden (el script de PDF saca la hoja 1, 2 y 3 por separado).
// Precio: null mientras no esté definido.
const PLANES = [
  { id: 'lite', nombre: 'Lite', eyebrow: 'Para empezar', lema: 'Empieza con un riesgo mínimo y conoce el proceso.', precio: null,
    fotos: 6, reels: 2, redes: 2, foto: 'img/lite.jpg', pos: '42% 50%' },
  { id: 'basic', nombre: 'Basic', eyebrow: 'Presencia constante', lema: 'Constancia, con estrategia y sin repetirte.', precio: null,
    fotos: 8, reels: 4, redes: 3, foto: 'img/basic.jpg', pos: '58% 50%' },
  { id: 'pro', nombre: 'Pro', eyebrow: 'Delegación total', lema: 'Tú apruebas desde el celular; nosotros hacemos todo lo demás.', precio: null,
    fotos: 12, reels: 8, redes: 5, foto: 'img/pro.jpg', pos: '55% 50%' },
];
// Todo el servicio, parte por parte. Cada valor va en orden Lite, Basic, Pro:
// true = incluido · false = no incluido · texto = cuánto
const SI = true, NO = false;
const SERVICIO = [
  { col: 0, titulo: 'Arranque', nota: 'Una vez', partes: [
    ['Entrevista guiada y ficha de tu negocio', [SI, SI, SI]],
    ['Voz de marca: cómo hablará tu marca', [SI, SI, SI]],
    ['Estudio de mercado de tu nicho, en PDF', [SI, SI, SI]],
    ['Estrategia: objetivos y conceptos', [SI, SI, SI]],
  ] },
  { col: 0, titulo: 'Tu mercado', nota: 'Todo el año', partes: [
    ['Vigilancia de tu competencia', ['Mensual', 'Quincenal', 'Semanal']],
    ['Revisión de tu estrategia', ['Cada 6 meses', 'Cada 3 meses', 'Cada mes']],
  ] },
  { col: 0, titulo: 'Acompañamiento', nota: 'Siempre', partes: [
    ['Pixely Partners en celular y computadora', [SI, SI, SI]],
    ['Respuesta por WhatsApp', ['En 24 h hábiles', 'En 12 h hábiles', 'El mismo día']],
  ] },
  { col: 1, titulo: 'Tu contenido', nota: 'Cada mes', partes: [
    ['Plan del mes: cada idea con su porqué', [SI, SI, SI]],
    ['Fotos y carruseles', ['6', '8', '12']],
    ['Reels con guion y edición', ['2', '4', '8']],
    ['Redes, con textos para cada una', ['2', '3', '5']],
    ['Cambios por pieza', ['1 ronda', '2 rondas', '3 rondas']],
  ] },
  { col: 1, titulo: 'Publicación y resultados', nota: 'Cada mes', partes: [
    ['Piezas listas para descargar en Partners', [SI, SI, SI]],
    ['Calendario con día y hora', [NO, SI, SI]],
    ['Publicamos por ti', [NO, NO, SI]],
    ['Resultados frente a tu competencia', [NO, NO, SI]],
    ['Videollamada mensual de resultados', [NO, NO, SI]],
  ] },
];
const WA = (n) => `https://wa.me/51949268607?text=${encodeURIComponent(`¡Hola Pixely! 👋 Me interesa el Plan ${n} ✨`)}`;
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const desde = (vals) => (vals[1] === NO ? 'Solo Pro' : 'Desde Basic');

const molde = document.getElementById('hoja');
PLANES.forEach((p, n) => {
  const h = molde.content.cloneNode(true);
  const pg = h.querySelector('.page');
  pg.classList.add(p.id);
  h.querySelectorAll('[data-k]').forEach((el) => { el.textContent = el.dataset.k === 'precio' ? (p.precio ? `S/ ${p.precio}` : 'S/ —') : p[el.dataset.k]; });
  h.querySelector('[data-wa]').href = WA(p.nombre);
  const img = h.querySelector('.frame img'); img.src = p.foto; img.style.objectPosition = p.pos;
  h.querySelectorAll('.tiers span').forEach((s) => s.classList.toggle('on', s.textContent === p.nombre));
  if (p.id === 'pro') h.querySelector('.hero').insertAdjacentHTML('afterbegin', '<svg class="radar" data-tono="oscuro" data-giro="-60" aria-hidden="true"></svg>');
  // Cuadros: 20 lugares (lo que trae Pro); los que no entran en este plan quedan apagados
  const tiles = h.querySelector('.tiles');
  for (let i = 0; i < 20; i++) tiles.insertAdjacentHTML('beforeend', `<i class="${i < p.fotos ? 'f' : i < p.fotos + p.reels ? 'r' : ''}"></i>`);
  h.querySelector('.nums').innerHTML = `<div><b>${p.fotos}</b><span>fotos y<br>carruseles</span></div><div><b class="pk">${p.reels}</b><span>reels</span></div><div><b>${p.redes}</b><span>redes</span></div>`;
  // Servicio
  const cols = [document.createElement('div'), document.createElement('div')];
  cols.forEach((c) => { c.className = 'col'; h.querySelector('.cols').appendChild(c); });
  for (const b of SERVICIO) {
    const lis = b.partes.map(([t, vals]) => {
      const v = vals[n];
      if (v === NO) return `<li class="no"><span>${t}</span><em>${desde(vals)}</em></li>`;
      if (v === SI) return `<li><span>${t}</span>${CHECK}</li>`;
      return `<li><span>${t}</span><em class="${n === 2 ? 'top' : ''}">${v}</em></li>`;
    }).join('');
    cols[b.col].insertAdjacentHTML('beforeend', `<div class="blk"><h4>${b.titulo}<span>${b.nota}</span></h4><ul>${lis}</ul></div>`);
  }
  document.body.appendChild(h);
});
</script>
<script src="../comun/radar.js"></script>
</body>
</html>
